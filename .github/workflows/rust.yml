name: Rust workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable, 1.85.0]
    env:
      RUST_TOOLCHAIN: ${{ matrix.rust }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Test all workspace targets
        run: cargo "+$RUST_TOOLCHAIN" test --workspace --all-targets --locked
      - name: Test documentation examples
        run: cargo "+$RUST_TOOLCHAIN" test --workspace --doc --locked
      - name: Run RustEditor campaign and capture provenance
        run: |
          mkdir -p target/corpus-evidence
          cargo "+$RUST_TOOLCHAIN" run -p rustlibrary-corpus-rust-editor --locked --quiet > target/corpus-evidence/observed.tsv
          cargo "+$RUST_TOOLCHAIN" run -p rustlibrary-corpus-rust-editor --bin native --locked --quiet > target/corpus-evidence/native.tsv
          rustc "+$RUST_TOOLCHAIN" --version --verbose > target/corpus-evidence/toolchain.txt
          cargo "+$RUST_TOOLCHAIN" --version >> target/corpus-evidence/toolchain.txt
          git rev-parse HEAD > target/corpus-evidence/commit.txt
      - name: Upload campaign evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-editor-${{ matrix.os }}-${{ matrix.rust }}
          path: target/corpus-evidence/
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Formatting, Clippy, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - name: Install stable Rust quality tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check Clippy warnings
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build API documentation
        run: cargo +stable doc --workspace --no-deps --locked
